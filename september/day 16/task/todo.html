<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playwrite+AU+QLD:wght@100..400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/todo.css" />
  </head>
  <body>
    <div id="todosContainer">
      <div id="addedTodos"></div>
      <h1>Todo list</h1>
      <!-- Add Todo Input -->
      <div>
        <input
          type="text"
          name="TodoName"
          id="todoInput"
          placeholder="Add your new todo"
          required
        />
      </div>

      <input
        type="text"
        name=""
        id="hoursInput"
        placeholder="Hours (hh)"
        required
      />
      <input
        type="text"
        name=""
        id="minsInput"
        placeholder="Mins (mm)"
        required
      />
      <div id="dateSelectors">
        <div id="columnContainer">
          <label for="day">Day:</label>
          <select id="day" required>
            <script>
              for (let i = 1; i <= 31; i++) {
                document.write(`<option value="${i}">${i}</option>`);
              }
            </script>
          </select>
        </div>

        <div id="columnContainer">
          <label for="month">Month:</label>
          <select id="month" required>
            <option value="1">January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
          </select>
        </div>

        <div id="columnContainer">
          <label for="year">Year:</label>
          <select id="year" required>
            <script>
              const currentYear = new Date().getFullYear();
              for (let y = currentYear; y <= currentYear + 5; y++) {
                document.write(`<option value="${y}">${y}</option>`);
              }
            </script>
          </select>
        </div>
      </div>
      <button id="addTodoButton">Add New Todo</button>
    </div>

    <script src="./js/idb.js"></script>
    <script src="sw.js"></script>
    <script src="./js/script.js"></script>
  </body>
</html>

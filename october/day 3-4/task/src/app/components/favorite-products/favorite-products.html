<h2>Favorite Products</h2>
<div class="favoriteProducts">
  @if (favoriteProducts.length === 0) {
  <p class="noFavoriteProducts">No favorite products available.</p>
  } @else { @for (product of favoriteProducts; track $index) {

  <div class="favoriteProductItem">
    <div>
      <h3>{{ product.name }}</h3>
      <p>Price: {{ product.price }}$</p>
      <p>Category: {{ product.category }}</p>
    </div>
    <h1 class="favoriteIcon">❤</h1>
  </div>
  } }
</div>

<form class="w-25 mx-auto mt-5" [formGroup]="loginForm" (ngSubmit)="login()">
  <div class="form-group">
    <label for="exampleInputEmail1">Email address</label>
    <input
      type="email"
      class="form-control mb-3"
      id="exampleInputEmail1"
      aria-describedby="emailHelp"
      placeholder="Enter email"
      formControlName="email"
    />
    @if (isRequired('email')) {
    <p class="text-danger">Email is Required</p>
    } @else if (invalidEmail()) {
    <p class="text-danger">Invalid Email</p>
    }
  </div>
  <div class="form-group">
    <label for="exampleInputPassword1">Password</label>
    <input
      type="password"
      class="form-control"
      id="exampleInputPassword1"
      placeholder="Password"
      formControlName="password"
    />
    @if (isRequired('password')) {
    <p class="text-danger">Password is Required</p>
    }
  </div>

  @if(!isValidCredentails && !isEmailEmpty() && !isPasswordEmpty()){
  <p class="text-danger">Your Email or Password is wrong</p>
  }
  <button type="submit" class="w-100 btn btn-primary mt-3">Submit</button>
</form>
